name: Deploy to ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant
          git pull origin main
          docker compose down || true
          docker compose up -d --build
          sleep 30
          docker ps -a
          docker logs ai-assistant --tail 20 2>&1 || true
          curl -f http://localhost:8000/health || (docker logs ai-assistant --tail 30 2>&1 && exit 1)

    - name: Rollback on failure
      if: failure()
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant
          PREV_COMMIT=$(cat /tmp/rollback_info.txt 2>/dev/null | grep "Previous commit:" | awk '{print $3}' || echo "none")
          if [ "$PREV_COMMIT" != "none" ]; then
            echo "Rolling back to $PREV_COMMIT"
            git reset --hard $PREV_COMMIT
            docker compose down
            docker compose up -d --build
          fi
