name: Deploy to ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant

          # 保存当前版本用于回滚
          CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "none")
          echo "Previous commit: $CURRENT_COMMIT" > /tmp/rollback_info.txt

          # 拉取新代码
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          # 停止旧容器
          docker compose down

          # 构建并启动新容器
          docker compose up -d --build

          # 等待容器启动
          echo "Waiting for container to start..."
          sleep 30

          # 检查容器状态
          echo "Container status:"
          docker ps -a | grep ai-assistant

          # 检查容器日志
          echo "Container logs (last 30 lines):"
          docker logs ai-assistant --tail 30 2>&1 || true

          # 健康检查
          echo "Running health check..."
          if curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "Deployment successful!"
          else
            echo "Health check failed!"
            echo "Final container logs:"
            docker logs ai-assistant --tail 50 2>&1 || true
            exit 1
          fi

    - name: Rollback on failure
      if: failure()
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant
          PREV_COMMIT=$(cat /tmp/rollback_info.txt 2>/dev/null | grep "Previous commit:" | awk '{print $3}' || echo "none")
          if [ "$PREV_COMMIT" != "none" ]; then
            echo "Rolling back to $PREV_COMMIT"
            git reset --hard $PREV_COMMIT
            docker compose down
            docker compose up -d --build
          fi
