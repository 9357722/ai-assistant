name: Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Import application
      run: python -c "import api_server; print('api_server import ok')"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        timeout: 20m
        script: |
          cd /root/ai-assistant
          git pull origin main
          docker compose down || true
          docker compose up -d --build
          sleep 30
          docker ps -a
          curl -f http://localhost:8000/health || (docker logs ai-assistant --tail 30 2>&1 && exit 1)
