name: Deploy to ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant
          git pull origin main
          docker compose down
          docker compose up -d --build
          sleep 10
          docker exec ai-assistant python -c "
          import pymysql, os
          conn = pymysql.connect(host='host.docker.internal', user='root', password='108045', db='product_db')
          cur = conn.cursor()
          imgs = sorted([f for f in os.listdir('/app/static/products') if f.startswith('product_') and f.endswith('.jpg')])
          cur.execute('SELECT id FROM products ORDER BY id')
          ids = [r[0] for r in cur.fetchall()]
          for i, pid in enumerate(ids):
              if i < len(imgs):
                  cur.execute('UPDATE products SET main_image = %s WHERE id = %s', (f'/static/products/{imgs[i]}', pid))
          conn.commit()
          conn.close()
          print('Database updated')
          "
