name: Deploy to ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USERNAME }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          cd /root/ai-assistant
          git pull origin main
          docker compose down
          docker compose up -d --build
          sleep 15
          docker exec ai-assistant sh -c "cp /app/static/products/product_100.jpg /app/static/products/蓝牙耳机_Pro.jpg 2>/dev/null; cp /app/static/products/product_101.jpg /app/static/products/蓝牙耳机_Lite.jpg 2>/dev/null; cp /app/static/products/product_102.jpg /app/static/products/iPhone_17_Pro.jpg 2>/dev/null; cp /app/static/products/product_103.jpg /app/static/products/华为Mate_70_Pro.jpg 2>/dev/null; cp /app/static/products/product_104.jpg /app/static/products/红米K80.jpg 2>/dev/null; cp /app/static/products/product_105.jpg /app/static/products/小米14.jpg 2>/dev/null; ls /app/static/products/*.jpg | wc -l"
