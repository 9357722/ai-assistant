name: Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 在 ECS 上构建并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_KEY }}
          script: |
            # 进入项目目录（如果不存在则克隆，存在则拉取）
            if [ ! -d "/root/ai-assistant" ]; then
              cd /root
              git clone https://github.com/9357722/ai-assistant.git
            else
              cd /root/ai-assistant
              git pull origin main
            fi

            # 注入环境变量
            export DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
            export OPENAI_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"

            # 停止旧服务、构建新镜像、启动服务
            cd /root/ai-assistant
            docker compose down || true
            docker build -t ai-assistant:slim .
            docker compose up -d