services:
  api:
    build: .
    image: ai-assistant:slim
    container_name: ai-assistant
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: host.docker.internal
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_DB: 0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/products?page_size=1').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
