services:
  api:
    build: .
    container_name: ai-assistant
    restart: always
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"