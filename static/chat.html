<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线客服 - 惠购商城</title>
    <link rel="stylesheet" href="/static/design-system.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .chat-container {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-6);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4) 0;
            min-height: 400px;
        }

        .message {
            margin-bottom: var(--space-6);
            display: flex;
            gap: var(--space-4);
            animation: fadeIn 0.3s var(--ease-out);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-lg);
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, var(--color-accent) 0%, #5856d6 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--color-accent);
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: var(--space-4) var(--space-5);
            border-radius: var(--radius-lg);
            line-height: var(--leading-relaxed);
            font-size: var(--text-base);
        }

        .message.ai .message-content {
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            color: var(--color-text);
        }

        .message.user .message-content {
            background: var(--color-accent);
            color: var(--color-text-inverse);
        }

        .chat-input-area {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            border: 1px solid var(--color-border);
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-4);
        }

        .chat-input {
            flex: 1;
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-sunken);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: var(--text-base);
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .chat-input:focus {
            border-color: var(--color-accent);
            background: var(--color-bg-elevated);
            box-shadow: 0 0 0 3px var(--color-accent-light);
        }

        .chat-input::placeholder {
            color: var(--color-text-tertiary);
        }

        .send-btn {
            height: 44px;
            padding: 0 var(--space-6);
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-base);
            font-weight: var(--weight-medium);
            transition: all var(--duration-fast) var(--ease-out);
            white-space: nowrap;
        }

        .send-btn:hover {
            background: var(--color-accent-hover);
            box-shadow: var(--shadow-accent);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background: var(--color-text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: var(--space-2) 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--color-text-tertiary);
            border-radius: var(--radius-full);
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .streaming-cursor {
            display: inline-block;
            animation: blink 1s step-end infinite;
            color: var(--color-accent);
            font-weight: var(--weight-bold);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .welcome-text {
            color: var(--color-text-secondary);
            text-align: center;
            padding: var(--space-8);
        }

        .welcome-text h2 {
            font-size: var(--text-xl);
            font-weight: var(--weight-semibold);
            color: var(--color-text);
            margin-bottom: var(--space-2);
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-3);
            justify-content: center;
            margin-top: var(--space-5);
        }

        .suggestion-chip {
            padding: var(--space-3) var(--space-5);
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            color: var(--color-text-secondary);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .suggestion-chip:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-light);
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: var(--space-4);
            }

            .message-content {
                max-width: 85%;
            }

            .suggestion-chips {
                gap: var(--space-2);
            }

            .suggestion-chip {
                padding: var(--space-2) var(--space-4);
                font-size: var(--text-xs);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <div class="logo-mark">惠</div>
                <span class="logo-text">惠购商城</span>
            </a>
            <div class="search">
                <span class="search-icon"></span>
                <input type="text" class="search-input" placeholder="搜索商品..." id="headerSearch" onkeydown="if(event.key==='Enter')window.location.href='/product.html?q='+this.value">
            </div>
            <nav class="nav">
                <a href="/" class="nav-link">首页</a>
                <a href="/product.html" class="nav-link">商品</a>
                <a href="/cart.html" class="nav-link">购物车</a>
                <a href="/orders.html" class="nav-link">订单</a>
                <a href="/user.html" class="nav-link">我的</a>
            </nav>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-text">
                <h2>你好，我是 惠购商城助手</h2>
                <p>我可以帮你搜索商品、比价、推荐好物</p>
                <div class="suggestion-chips">
                    <div class="suggestion-chip" onclick="sendSuggestion('推荐一款3000元的手机')">推荐3000元手机</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('iPhone 15和小米14哪个好')">iPhone vs 小米</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('有什么好用的降噪耳机')">降噪耳机推荐</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('帮我配一套游戏设备')">游戏设备搭配</div>
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <textarea class="chat-input" id="chatInput" placeholder="输入你的问题..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script>
        let isGenerating = false;

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || isGenerating) return;

            const token = localStorage.getItem('token');
            if (!token) {
                alert('请先登录');
                window.location.href = '/user.html';
                return;
            }

            appendMessage('user', message);
            input.value = '';
            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            const aiDiv = createStreamingMessage();

            try {
                const res = await fetch(`${API_BASE}/api/ai/chat/stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });

                if (!res.ok) {
                    aiDiv.querySelector('.message-content').textContent = '请求失败，请稍后重试。';
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                const msgEl = aiDiv.querySelector('.message-content');
                const chatEl = document.getElementById('chatMessages');
                let lastUpdate = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    const now = Date.now();
                    if (now - lastUpdate > 30 || done) {
                        msgEl.innerHTML = escapeHTML(fullText).replace(/\n/g, '<br>');
                        chatEl.scrollTop = chatEl.scrollHeight;
                        lastUpdate = now;
                    }
                }
                msgEl.innerHTML = escapeHTML(fullText).replace(/\n/g, '<br>');
                chatEl.scrollTop = chatEl.scrollHeight;
            } catch (err) {
                aiDiv.querySelector('.message-content').textContent = '网络错误，请检查连接。';
            }

            isGenerating = false;
            document.getElementById('sendBtn').disabled = false;
        }

        function appendMessage(role, content) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="message-avatar">${role === 'ai' ? 'A' : 'U'}</div>
                <div class="message-content">${escapeHTML(content).replace(/\n/g, '<br>')}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function createStreamingMessage() {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="message-avatar">A</div>
                <div class="message-content">
                    <span class="streaming-cursor">▋</span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }
    </script>
    <script src="/static/ws.js"></script>
</body>
</html>
