<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 惠购商城</title>
    <link rel="stylesheet" href="/static/design-system.css">
    <style>
        /* ============ 订单页专属样式 ============ */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-6);
        }
        .page-title {
            font-size: var(--text-2xl);
            font-weight: var(--weight-bold);
            margin-bottom: var(--space-6);
            letter-spacing: -0.3px;
        }
        .status-tabs {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
        }
        .status-tab {
            padding: var(--space-2) var(--space-5);
            background: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--duration-fast);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
        }
        .status-tab:hover { border-color: var(--color-accent); color: var(--color-text); }
        .status-tab.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }

        .order-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            margin-bottom: var(--space-5);
            overflow: hidden;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-5);
            background: var(--color-bg-sunken);
            border-bottom: 1px solid var(--color-divider);
        }
        .order-no { color: var(--color-text-secondary); font-size: var(--text-xs); }
        .order-status {
            padding: 2px var(--space-3);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: var(--weight-medium);
        }
        .status-pending { background: rgba(255, 149, 0, 0.15); color: var(--color-warning); }
        .status-paid { background: rgba(52, 199, 89, 0.15); color: var(--color-success); }
        .status-shipped { background: rgba(0, 113, 227, 0.15); color: var(--color-accent); }
        .status-completed { background: rgba(52, 199, 89, 0.15); color: var(--color-success); }
        .status-cancelled { background: rgba(255, 59, 48, 0.15); color: var(--color-danger); }

        .order-items { padding: var(--space-3) var(--space-5); }
        .order-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--color-divider);
        }
        .order-item:last-child { border-bottom: none; }
        .item-image {
            width: 60px;
            height: 60px;
            background: var(--color-bg-sunken);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .item-image img { width: 100%; height: 100%; object-fit: cover; }
        .item-info { flex: 1; }
        .item-name { font-weight: var(--weight-medium); font-size: var(--text-sm); margin-bottom: 2px; }
        .item-spec { color: var(--color-text-secondary); font-size: var(--text-xs); }
        .item-price { text-align: right; }
        .price { font-weight: var(--weight-semibold); color: var(--color-danger); font-size: var(--text-sm); }
        .quantity { color: var(--color-text-secondary); font-size: var(--text-xs); }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-5);
            background: var(--color-bg-sunken);
            border-top: 1px solid var(--color-divider);
        }
        .order-time { color: var(--color-text-secondary); font-size: var(--text-xs); }
        .order-total { font-size: var(--text-md); font-weight: var(--weight-semibold); }
        .order-total .amount { color: var(--color-danger); }
        .order-actions { display: flex; gap: var(--space-2); margin-left: var(--space-4); }
        .action-btn {
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            cursor: pointer;
            transition: all var(--duration-fast);
            border: 1px solid var(--color-border);
            background: transparent;
            color: var(--color-text);
            font-weight: var(--weight-medium);
        }
        .action-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
        .action-btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
        .action-btn.primary:hover { background: var(--color-accent-hover); }
        .action-btn.danger { border-color: var(--color-danger); color: var(--color-danger); }
        .action-btn.danger:hover { background: var(--color-danger); color: #fff; }

        .empty-state {
            text-align: center;
            padding: var(--space-16) var(--space-6);
            background: var(--color-bg-elevated);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }
        .empty-icon { font-size: 64px; margin-bottom: var(--space-4); }
        .empty-text { color: var(--color-text-secondary); margin-bottom: var(--space-5); }

        /* 详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--color-bg-overlay);
            z-index: 200;
        }
        .modal-content {
            max-width: 700px;
            margin: 5vh auto;
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--color-divider);
            position: sticky;
            top: 0;
            background: var(--color-bg-elevated);
            z-index: 10;
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: var(--text-xl);
            cursor: pointer;
        }
        .modal-body { padding: var(--space-5); }
        .detail-section { margin-bottom: var(--space-5); }
        .detail-title {
            font-size: var(--text-base);
            font-weight: var(--weight-semibold);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--color-divider);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-2);
            font-size: var(--text-sm);
        }
        .detail-row .label { color: var(--color-text-secondary); }
        .detail-row .value { color: var(--color-text); }

        .pagination {
            display: flex;
            justify-content: center;
            gap: var(--space-2);
            margin-top: var(--space-6);
        }
        .page-btn {
            padding: var(--space-2) var(--space-3);
            background: var(--color-bg-sunken);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all var(--duration-fast);
        }
        .page-btn.active { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
        .page-btn:hover:not(.active) { border-color: var(--color-accent); }

        @media (max-width: 768px) {
            .order-header { flex-direction: column; gap: var(--space-2); align-items: flex-start; }
            .order-footer { flex-direction: column; gap: var(--space-3); align-items: flex-start; }
            .order-actions { margin-left: 0; width: 100%; }
            .action-btn { flex: 1; text-align: center; }
        }

        /* 支付方式选择弹窗 */
        .payment-modal {
            width: 400px;
            max-width: 90%;
        }
        .payment-methods {
            display: flex;
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }
        .payment-method {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px solid #eee;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            width: 140px;
        }
        .payment-method:hover {
            border-color: var(--color-accent);
            background: rgba(0, 113, 227, 0.05);
        }
        .method-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }
        .alipay-icon {
            background: linear-gradient(135deg, #1677ff, #4096ff);
        }
        .wechat-icon {
            background: linear-gradient(135deg, #07c160, #2aae67);
        }
        .method-name {
            font-size: 14px;
            color: #333;
        }
        .payment-amount {
            text-align: center;
            padding: 15px;
            font-size: 18px;
            color: var(--color-danger);
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <div class="logo-mark"></div>
                <div class="logo-text">惠购商城</div>
            </a>
            <nav class="nav">
                <a href="/" class="nav-link">首页</a>
                <a href="/product.html" class="nav-link">商品</a>
                <a href="/cart.html" class="nav-link">购物车</a>
                <a href="/orders.html" class="nav-link active">订单</a>
                <a href="/user.html" class="nav-link">我的</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <h1 class="page-title">我的订单</h1>
        <div class="status-tabs">
            <div class="status-tab active" data-status="">全部</div>
            <div class="status-tab" data-status="pending">待支付</div>
            <div class="status-tab" data-status="paid">已支付</div>
            <div class="status-tab" data-status="shipped">已发货</div>
            <div class="status-tab" data-status="completed">已完成</div>
            <div class="status-tab" data-status="cancelled">已取消</div>
        </div>
        <div id="orderList">
            <div style="text-align:center;padding:var(--space-12);color:var(--color-text-secondary)">
                <div class="loading-spinner" style="margin:0 auto"></div>
                <p style="margin-top:12px">加载中...</p>
            </div>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>订单详情</h3>
                <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            </div>
            <div class="modal-body" id="orderDetail"></div>
        </div>
    </div>

    <!-- 支付方式选择弹窗 -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content payment-modal">
            <div class="modal-header">
                <h3>选择支付方式</h3>
                <button type="button" class="modal-close" onclick="closePaymentModal()">&times;</button>
            </div>
            <div class="payment-methods">
                <div class="payment-method" onclick="selectPayment('alipay')">
                    <div class="method-icon alipay-icon">支</div>
                    <div class="method-name">支付宝</div>
                </div>
                <div class="payment-method" onclick="selectPayment('wechat')">
                    <div class="method-icon wechat-icon">微</div>
                    <div class="method-name">微信支付</div>
                </div>
            </div>
            <div class="payment-amount">
                支付金额: <span id="paymentAmount">¥0.00</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/common.js"></script>
    <script>
        let currentStatus = '';
        let currentPage = 1;

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) { showToast('请先登录', 'error'); setTimeout(() => window.location.href = '/user.html', 1000); return false; }
            return true;
        }

        const statusMap = { pending: '待支付', paid: '已支付', shipped: '已发货', completed: '已完成', cancelled: '已取消' };

        async function loadOrders() {
            if (!checkAuth()) return;
            const token = localStorage.getItem('token');
            const container = document.getElementById('orderList');
            container.innerHTML = '<div style="text-align:center;padding:var(--space-12);color:var(--color-text-secondary)"><div class="loading-spinner" style="margin:0 auto"></div><p style="margin-top:12px">加载中...</p></div>';
            try {
                let url = `${API_BASE}/api/orders?page=${currentPage}&page_size=10`;
                if (currentStatus) url += `&status=${currentStatus}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        container.innerHTML = data.items.map(order => renderOrderCard(order)).join('');
                        renderPagination(data.total, data.page, data.page_size);
                    } else {
                        container.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><p class="empty-text">暂无订单</p><a href="/product.html" class="btn btn-primary">去购物</a></div>';
                        document.getElementById('pagination').innerHTML = '';
                    }
                } else { container.innerHTML = '<div class="empty-state"><p class="empty-text">加载失败</p></div>'; }
            } catch (err) { container.innerHTML = '<div class="empty-state"><p class="empty-text">网络错误</p></div>'; }
        }

        function renderOrderCard(order) {
            const itemsHtml = order.items.map(item => `
                <div class="order-item">
                    <div class="item-image"><img src="${item.product_image || '/static/products/product_' + item.product_id + '.jpg'}" alt="${escapeHTML(item.product_name)}" loading="lazy"></div>
                    <div class="item-info">
                        <div class="item-name">${escapeHTML(item.product_name)}</div>
                        <div class="item-spec">x${item.quantity}</div>
                    </div>
                    <div class="item-price"><div class="price">¥${item.price}</div></div>
                </div>`).join('');
            const actionsHtml = renderOrderActions(order);
            return `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-no">订单号: ${order.order_no}</span>
                        <span class="order-status status-${order.status}">${statusMap[order.status] || order.status}</span>
                    </div>
                    <div class="order-items">${itemsHtml}</div>
                    <div class="order-footer">
                        <span class="order-time">${new Date(order.created_at).toLocaleString()}</span>
                        <div style="display:flex;align-items:center">
                            <span class="order-total">合计: <span class="amount">¥${order.total_amount}</span></span>
                            <div class="order-actions">${actionsHtml}</div>
                        </div>
                    </div>
                </div>`;
        }

        function renderOrderActions(order) {
            let html = `<button class="action-btn" onclick="viewOrderDetail(${order.id})">详情</button>`;
            if (order.status === 'pending') {
                html += `<button class="action-btn primary" onclick="payOrder(${order.id}, ${order.total_amount})">支付</button>`;
                html += `<button class="action-btn danger" onclick="cancelOrder(${order.id})">取消</button>`;
            } else if (order.status === 'shipped') {
                html += `<button class="action-btn primary" onclick="confirmOrder(${order.id})">确认收货</button>`;
            }
            return html;
        }

        async function viewOrderDetail(orderId) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/orders/${orderId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) { renderOrderDetail(await res.json()); document.getElementById('orderModal').style.display = 'block'; }
                else showToast('获取订单详情失败', 'error');
            } catch (err) { showToast('网络错误', 'error'); }
        }

        function renderOrderDetail(order) {
            const address = order.address_snapshot || {};
            const itemsHtml = order.items.map(item => `
                <div class="order-item">
                    <div class="item-image">${item.product_image ? `<img src="${safeImageUrl(item.product_image, '')}" alt="${escapeHTML(item.product_name)}">` : ''}</div>
                    <div class="item-info">
                        <div class="item-name">${escapeHTML(item.product_name)}</div>
                        <div class="item-spec">单价: ¥${item.price} x${item.quantity}</div>
                    </div>
                    <div class="item-price"><div class="price">¥${(item.price * item.quantity).toFixed(2)}</div></div>
                </div>`).join('');
            document.getElementById('orderDetail').innerHTML = `
                <div class="detail-section">
                    <h4 class="detail-title">订单信息</h4>
                    <div class="detail-row"><span class="label">订单号</span><span class="value">${escapeHTML(order.order_no)}</span></div>
                    <div class="detail-row"><span class="label">订单状态</span><span class="value">${escapeHTML(statusMap[order.status] || order.status)}</span></div>
                    <div class="detail-row"><span class="label">下单时间</span><span class="value">${new Date(order.created_at).toLocaleString()}</span></div>
                    ${order.paid_at ? `<div class="detail-row"><span class="label">支付时间</span><span class="value">${new Date(order.paid_at).toLocaleString()}</span></div>` : ''}
                    ${order.remark ? `<div class="detail-row"><span class="label">备注</span><span class="value">${escapeHTML(order.remark)}</span></div>` : ''}
                </div>
                <div class="detail-section">
                    <h4 class="detail-title">收货信息</h4>
                    <div class="detail-row"><span class="label">收货人</span><span class="value">${escapeHTML(address.name) || '-'}</span></div>
                    <div class="detail-row"><span class="label">联系电话</span><span class="value">${escapeHTML(address.phone) || '-'}</span></div>
                    <div class="detail-row"><span class="label">收货地址</span><span class="value">${escapeHTML(address.province || '')}${escapeHTML(address.city || '')}${escapeHTML(address.district || '')}${escapeHTML(address.detail || '-')}</span></div>
                </div>
                <div class="detail-section"><h4 class="detail-title">商品信息</h4>${itemsHtml}</div>
                <div class="detail-section">
                    <h4 class="detail-title">费用信息</h4>
                    <div class="detail-row"><span class="label">商品金额</span><span class="value">¥${order.total_amount}</span></div>
                    <div class="detail-row"><span class="label">运费</span><span class="value">免运费</span></div>
                    <div class="detail-row" style="font-weight:var(--weight-semibold);font-size:var(--text-md)"><span class="label">实付金额</span><span class="value" style="color:var(--color-danger)">¥${order.pay_amount || order.total_amount}</span></div>
                </div>`;
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        let currentPayOrderId = null;
        let currentPayAmount = 0;

        function payOrder(orderId, amount) {
            currentPayOrderId = orderId;
            currentPayAmount = amount;
            document.getElementById('paymentAmount').textContent = `¥${amount}`;
            document.getElementById('paymentModal').style.display = 'block';
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
            currentPayOrderId = null;
        }

        async function selectPayment(method) {
            if (!currentPayOrderId) return;

            const token = localStorage.getItem('token');
            const methodName = method === 'alipay' ? '支付宝' : '微信支付';

            try {
                showToast(`正在通过${methodName}支付...`);
                const res = await fetch(`${API_BASE}/api/orders/${currentPayOrderId}/pay`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ payment_method: method })
                });

                if (res.ok) {
                    closePaymentModal();
                    showToast(`${methodName}支付成功`);
                    loadOrders();
                } else {
                    const data = await res.json();
                    showToast(data.detail || '支付失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('确定要取消订单吗？')) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/orders/${orderId}/cancel`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) { showToast('订单已取消'); loadOrders(); }
                else { const data = await res.json(); showToast(data.detail || '取消失败', 'error'); }
            } catch (err) { showToast('网络错误', 'error'); }
        }

        async function confirmOrder(orderId) {
            if (!confirm('确认已收到商品？')) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/orders/${orderId}/complete`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) { showToast('已确认收货'); loadOrders(); }
                else { const data = await res.json(); showToast(data.detail || '确认失败', 'error'); }
            } catch (err) { showToast('网络错误', 'error'); }
        }

        function renderPagination(total, page, pageSize) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '';
            if (page > 1) html += `<button class="page-btn" onclick="goToPage(${page - 1})">上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                    html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === page - 3 || i === page + 3) {
                    html += '<span style="color:var(--color-text-tertiary)">...</span>';
                }
            }
            if (page < totalPages) html += `<button class="page-btn" onclick="goToPage(${page + 1})">下一页</button>`;
            container.innerHTML = html;
        }

        function goToPage(page) { currentPage = page; loadOrders(); window.scrollTo(0, 0); }

        document.querySelectorAll('.status-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentStatus = tab.dataset.status;
                currentPage = 1;
                loadOrders();
            });
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.cssText = `position:fixed;top:80px;right:20px;padding:var(--space-3) var(--space-5);background:${type === 'error' ? 'var(--color-danger)' : 'var(--color-success)'};color:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:300;transform:translateX(120%);transition:transform var(--duration-normal);font-size:var(--text-sm)`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('orderModal').addEventListener('click', (e) => { if (e.target === document.getElementById('orderModal')) closeOrderModal(); });
        loadOrders();
    </script>
    <script src="/static/ws.js"></script>
</body>
</html>
