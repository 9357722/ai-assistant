<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - AI 智能电商导购平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f0f23;
            --bg-card: #1a1a3e;
            --bg-input: #252547;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #2d2d5e;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 100%);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            margin-left: auto;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-links a.active {
            color: var(--primary);
        }

        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Auth Section */
        .auth-container {
            max-width: 450px;
            margin: 4rem auto;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .submit-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* User Profile */
        .profile-container {
            display: none;
        }

        .profile-header {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            border: 1px solid var(--border-color);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .profile-info p {
            color: var(--text-secondary);
        }

        .profile-stats {
            display: flex;
            gap: 2rem;
            margin-left: auto;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-list {
            list-style: none;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: color 0.3s;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            color: var(--primary);
        }

        .menu-item .icon {
            margin-right: 0.75rem;
        }

        .menu-item .arrow {
            color: var(--text-secondary);
        }

        /* Quick Links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .quick-link {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
        }

        .quick-link:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .quick-link .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .quick-link .text {
            font-size: 0.9rem;
        }

        /* Profile Form */
        .profile-form {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-secondary {
            padding: 0.75rem 1.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        /* Address Section */
        .address-section {
            display: none;
        }

        .address-card {
            background: var(--bg-input);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .address-info .name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .address-info .detail {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .address-info .phone {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .address-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        .icon-btn.danger:hover {
            color: var(--danger);
        }

        .add-btn {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .add-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Address Form Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
        }

        .modal-content {
            max-width: 500px;
            margin: 10vh auto;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1.5rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 1rem 1.5rem;
            background: var(--success);
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 300;
            transform: translateX(120%);
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                margin-left: 0;
                margin-top: 1rem;
            }

            .quick-links {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">AI 智购</a>
            <nav class="nav-links">
                <a href="/">首页</a>
                <a href="/product.html">商品</a>
                <a href="/cart.html">购物车</a>
                <a href="/orders.html">订单</a>
                <a href="/user.html" class="active">我的</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Auth Section (Login/Register) -->
        <div class="auth-container" id="authSection">
            <div class="auth-card">
                <h2 class="auth-title">欢迎来到 AI 智购</h2>
                <div class="auth-tabs">
                    <div class="auth-tab active" data-tab="login">登录</div>
                    <div class="auth-tab" data-tab="register">注册</div>
                </div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">登录</button>
                    <p class="form-footer">
                        还没有账号？<a href="#" onclick="switchTab('register')">立即注册</a>
                    </p>
                </form>

                <!-- Register Form -->
                <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="regUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="请输入密码" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-input" id="regConfirmPassword" placeholder="请再次输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">注册</button>
                    <p class="form-footer">
                        已有账号？<a href="#" onclick="switchTab('login')">立即登录</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- User Profile Section -->
        <div class="profile-container" id="profileSection">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-info">
                    <h2 id="profileUsername">用户名</h2>
                    <p id="profileEmail">邮箱</p>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="orderCount">0</div>
                        <div class="stat-label">订单</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="cartCount">0</div>
                        <div class="stat-label">购物车</div>
                    </div>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="quick-links">
                <a href="/orders.html" class="quick-link">
                    <div class="icon">📦</div>
                    <div class="text">我的订单</div>
                </a>
                <a href="/cart.html" class="quick-link">
                    <div class="icon">🛒</div>
                    <div class="text">购物车</div>
                </a>
                <a href="#" class="quick-link" onclick="showSection('address')">
                    <div class="icon">📍</div>
                    <div class="text">收货地址</div>
                </a>
                <a href="#" class="quick-link" onclick="showSection('profile')">
                    <div class="icon">⚙️</div>
                    <div class="text">个人设置</div>
                </a>
            </div>

            <!-- Profile Settings -->
            <div class="profile-form" id="profileForm">
                <div class="profile-card">
                    <h3 class="card-title">个人信息</h3>
                    <form onsubmit="updateProfile(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-input" id="editUsername" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-input" id="editEmail">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">手机号</label>
                                <input type="tel" class="form-input" id="editPhone">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="submit-btn" style="flex: 1;">保存修改</button>
                            <button type="button" class="btn-secondary" onclick="showSection(null)">取消</button>
                        </div>
                    </form>
                </div>

                <div class="profile-card" style="margin-top: 1.5rem;">
                    <h3 class="card-title">修改密码</h3>
                    <form onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label class="form-label">当前密码</label>
                            <input type="password" class="form-input" id="oldPassword" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-input" id="newPassword" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-input" id="confirmNewPassword" required>
                        </div>
                        <button type="submit" class="submit-btn">修改密码</button>
                    </form>
                </div>
            </div>

            <!-- Address Section -->
            <div class="address-section" id="addressSection">
                <div class="profile-card">
                    <h3 class="card-title">收货地址</h3>
                    <div id="addressList"></div>
                    <button class="add-btn" onclick="showAddressForm()">+ 添加新地址</button>
                </div>
            </div>

            <!-- Menu -->
            <div class="profile-card" style="margin-top: 1.5rem;">
                <ul class="menu-list">
                    <li class="menu-item" onclick="window.location.href='/orders.html'">
                        <span><span class="icon">📦</span> 我的订单</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="window.location.href='/cart.html'">
                        <span><span class="icon">🛒</span> 购物车</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="showSection('address')">
                        <span><span class="icon">📍</span> 收货地址</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="handleLogout()">
                        <span><span class="icon">🚪</span> 退出登录</span>
                        <span class="arrow">›</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Address Form Modal -->
    <div class="modal-overlay" id="addressModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="addressFormTitle">添加收货地址</h3>
                <button class="modal-close" onclick="closeAddressModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="saveAddress(event)">
                    <div class="form-group">
                        <label class="form-label">收货人</label>
                        <input type="text" class="form-input" id="addrName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-input" id="addrPhone" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">省份</label>
                            <input type="text" class="form-input" id="addrProvince">
                        </div>
                        <div class="form-group">
                            <label class="form-label">城市</label>
                            <input type="text" class="form-input" id="addrCity">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">区/县</label>
                            <input type="text" class="form-input" id="addrDistrict">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">详细地址</label>
                        <input type="text" class="form-input" id="addrDetail" required>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="addrDefault">
                            <span>设为默认地址</span>
                        </label>
                    </div>
                    <button type="submit" class="submit-btn">保存地址</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '';
        let currentUser = null;
        let editingAddressId = null;

        // Check login status
        function checkAuth() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');

            if (token && username) {
                showProfile();
                loadUserProfile();
            } else {
                showAuth();
            }
        }

        // Show auth section
        function showAuth() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('profileSection').style.display = 'none';
        }

        // Show profile section
        function showProfile() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'block';
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');

            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        // Auth tabs click
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        // Handle login
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_BASE}/api/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', data.username || username);
                    showToast('登录成功');
                    setTimeout(() => checkAuth(), 500);
                } else {
                    showToast(data.detail || '登录失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Handle register
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                showToast('两次密码不一致', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/user/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast('注册成功，请登录');
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    showToast(data.detail || '注册失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Load user profile
        async function loadUserProfile() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    currentUser = await res.json();
                    renderProfile();
                    loadOrderCount();
                    loadCartCount();
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('username');
                    showAuth();
                }
            } catch (err) {
                showToast('加载用户信息失败', 'error');
            }
        }

        // Render profile
        function renderProfile() {
            if (!currentUser) return;

            document.getElementById('profileAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('profileUsername').textContent = currentUser.username;
            document.getElementById('profileEmail').textContent = currentUser.email;

            // Edit form
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editEmail').value = currentUser.email;
            document.getElementById('editPhone').value = currentUser.phone || '';
        }

        // Load order count
        async function loadOrderCount() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/orders?page_size=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('orderCount').textContent = data.total || 0;
                }
            } catch (err) {}
        }

        // Load cart count
        async function loadCartCount() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/cart`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('cartCount').textContent = data.items ? data.items.length : 0;
                }
            } catch (err) {}
        }

        // Show section
        function showSection(section) {
            document.getElementById('profileForm').style.display = section === 'profile' ? 'block' : 'none';
            document.getElementById('addressSection').style.display = section === 'address' ? 'block' : 'none';

            if (section === 'address') {
                loadAddresses();
            }
        }

        // Update profile
        async function updateProfile(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const email = document.getElementById('editEmail').value;
            const phone = document.getElementById('editPhone').value;

            try {
                const res = await fetch(`${API_BASE}/api/user/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ email, phone })
                });

                if (res.ok) {
                    showToast('更新成功');
                    loadUserProfile();
                } else {
                    const data = await res.json();
                    showToast(data.detail || '更新失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Change password
        async function changePassword(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showToast('两次密码不一致', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/user/password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                if (res.ok) {
                    showToast('密码修改成功');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmNewPassword').value = '';
                } else {
                    const data = await res.json();
                    showToast(data.detail || '修改失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Load addresses
        async function loadAddresses() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    renderAddresses(data.items || []);
                }
            } catch (err) {
                showToast('加载地址失败', 'error');
            }
        }

        // Render addresses
        function renderAddresses(addresses) {
            const container = document.getElementById('addressList');

            if (addresses.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 1rem;">暂无收货地址</p>';
                return;
            }

            container.innerHTML = addresses.map(addr => `
                <div class="address-card">
                    <div class="address-info">
                        <div class="name">${addr.name} ${addr.is_default ? '<span style="color: var(--primary); font-size: 0.8rem;">默认</span>' : ''}</div>
                        <div class="detail">${addr.province || ''}${addr.city || ''}${addr.district || ''}${addr.detail || ''}</div>
                        <div class="phone">${addr.phone}</div>
                    </div>
                    <div class="address-actions">
                        <button class="icon-btn" onclick="editAddress(${addr.id})">✏️</button>
                        <button class="icon-btn danger" onclick="deleteAddress(${addr.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        // Show address form
        function showAddressForm() {
            editingAddressId = null;
            document.getElementById('addressFormTitle').textContent = '添加收货地址';
            document.getElementById('addrName').value = '';
            document.getElementById('addrPhone').value = '';
            document.getElementById('addrProvince').value = '';
            document.getElementById('addrCity').value = '';
            document.getElementById('addrDistrict').value = '';
            document.getElementById('addrDetail').value = '';
            document.getElementById('addrDefault').checked = false;
            document.getElementById('addressModal').style.display = 'block';
        }

        // Edit address
        async function editAddress(id) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    const addr = (data.items || []).find(a => a.id === id);
                    if (addr) {
                        editingAddressId = id;
                        document.getElementById('addressFormTitle').textContent = '编辑收货地址';
                        document.getElementById('addrName').value = addr.name;
                        document.getElementById('addrPhone').value = addr.phone;
                        document.getElementById('addrProvince').value = addr.province || '';
                        document.getElementById('addrCity').value = addr.city || '';
                        document.getElementById('addrDistrict').value = addr.district || '';
                        document.getElementById('addrDetail').value = addr.detail || '';
                        document.getElementById('addrDefault').checked = addr.is_default;
                        document.getElementById('addressModal').style.display = 'block';
                    }
                }
            } catch (err) {
                showToast('加载地址失败', 'error');
            }
        }

        // Close address modal
        function closeAddressModal() {
            document.getElementById('addressModal').style.display = 'none';
        }

        // Save address
        async function saveAddress(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');

            const addressData = {
                name: document.getElementById('addrName').value,
                phone: document.getElementById('addrPhone').value,
                province: document.getElementById('addrProvince').value,
                city: document.getElementById('addrCity').value,
                district: document.getElementById('addrDistrict').value,
                detail: document.getElementById('addrDetail').value,
                is_default: document.getElementById('addrDefault').checked
            };

            try {
                let url = `${API_BASE}/api/user/addresses`;
                let method = 'POST';

                if (editingAddressId) {
                    url = `${API_BASE}/api/user/addresses/${editingAddressId}`;
                    method = 'PUT';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(addressData)
                });

                if (res.ok) {
                    showToast(editingAddressId ? '地址更新成功' : '地址添加成功');
                    closeAddressModal();
                    loadAddresses();
                } else {
                    const data = await res.json();
                    showToast(data.detail || '保存失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Delete address
        async function deleteAddress(id) {
            if (!confirm('确定删除该地址？')) return;

            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showToast('地址已删除');
                    loadAddresses();
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        // Handle logout
        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            showToast('已退出登录');
            setTimeout(() => checkAuth(), 500);
        }

        // Show toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Close modal on outside click
        document.getElementById('addressModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('addressModal')) closeAddressModal();
        });

        // Initialize
        checkAuth();
    </script>
</body>
</html>
