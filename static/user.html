<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 惠购商城</title>
    <link rel="stylesheet" href="/static/design-system.css">
    <style>
        /* 页面特定样式 */
        .auth-container {
            max-width: 450px;
            margin: var(--space-16) auto;
        }

        .auth-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-lg);
        }

        .auth-title {
            font-size: var(--text-2xl);
            font-weight: var(--weight-bold);
            text-align: center;
            margin-bottom: var(--space-8);
            letter-spacing: -0.3px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: var(--space-6);
            border-bottom: 1px solid var(--color-border);
        }

        .auth-tab {
            flex: 1;
            padding: var(--space-4);
            text-align: center;
            cursor: pointer;
            color: var(--color-text-secondary);
            font-weight: var(--weight-medium);
            border-bottom: 2px solid transparent;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .auth-tab.active {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-sunken);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-size: var(--text-base);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .form-input:focus {
            outline: none;
            background: var(--color-bg-elevated);
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-light);
        }

        .form-input::placeholder {
            color: var(--color-text-tertiary);
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            background: var(--color-accent);
            color: var(--color-text-inverse);
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--text-base);
            font-weight: var(--weight-semibold);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .submit-btn:hover {
            background: var(--color-accent-hover);
            box-shadow: var(--shadow-accent);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: var(--color-text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .form-footer {
            text-align: center;
            margin-top: var(--space-5);
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
        }

        .form-footer a {
            color: var(--color-accent);
            font-weight: var(--weight-medium);
        }

        /* 用户资料 */
        .profile-container {
            display: none;
        }

        .profile-header {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            margin-bottom: var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-8);
            border: 1px solid var(--color-border);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--color-accent) 0%, #5856d6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-3xl);
            font-weight: var(--weight-bold);
            color: white;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: var(--text-xl);
            font-weight: var(--weight-semibold);
            margin-bottom: var(--space-1);
        }

        .profile-info p {
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
        }

        .profile-stats {
            display: flex;
            gap: var(--space-8);
            margin-left: auto;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: var(--text-2xl);
            font-weight: var(--weight-bold);
            color: var(--color-accent);
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: var(--text-xs);
            margin-top: var(--space-1);
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-5);
        }

        .profile-card {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            border: 1px solid var(--color-border);
        }

        .card-title {
            font-size: var(--text-md);
            font-weight: var(--weight-semibold);
            margin-bottom: var(--space-5);
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--color-divider);
        }

        /* 快捷入口 */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .quick-link {
            background: var(--color-bg-elevated);
            border-radius: var(--radius-md);
            padding: var(--space-6);
            text-align: center;
            border: 1px solid var(--color-border);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            text-decoration: none;
            color: var(--color-text);
        }

        .quick-link:hover {
            border-color: var(--color-accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .quick-link .icon {
            font-size: var(--text-2xl);
            margin-bottom: var(--space-2);
        }

        .quick-link .text {
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
        }

        /* 菜单列表 */
        .menu-list {
            list-style: none;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) 0;
            border-bottom: 1px solid var(--color-divider);
            cursor: pointer;
            transition: color var(--duration-fast) var(--ease-out);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            color: var(--color-accent);
        }

        .menu-item .icon {
            margin-right: var(--space-3);
        }

        .menu-item .arrow {
            color: var(--color-text-tertiary);
            font-size: var(--text-lg);
        }

        /* 表单行 */
        .form-row {
            display: flex;
            gap: var(--space-4);
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-5);
        }

        .btn-secondary {
            padding: var(--space-3) var(--space-6);
            background: var(--color-bg-sunken);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            cursor: pointer;
            font-weight: var(--weight-medium);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .btn-secondary:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        /* 地址 */
        .address-section {
            display: none;
        }

        .address-card {
            background: var(--color-bg-sunken);
            border-radius: var(--radius-sm);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .address-info .name {
            font-weight: var(--weight-semibold);
            margin-bottom: var(--space-1);
        }

        .address-info .detail {
            color: var(--color-text-secondary);
            font-size: var(--text-sm);
        }

        .address-info .phone {
            color: var(--color-text-tertiary);
            font-size: var(--text-xs);
            margin-top: var(--space-1);
        }

        .address-actions {
            display: flex;
            gap: var(--space-2);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: var(--text-md);
            padding: var(--space-2);
            border-radius: var(--radius-sm);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .icon-btn:hover {
            color: var(--color-accent);
            background: var(--color-accent-light);
        }

        .icon-btn.danger:hover {
            color: var(--color-danger);
            background: rgba(255, 59, 48, 0.1);
        }

        .add-btn {
            width: 100%;
            padding: var(--space-4);
            background: transparent;
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            font-size: var(--text-base);
            font-weight: var(--weight-medium);
        }

        .add-btn:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        /* 地址弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-bg-overlay);
            z-index: 200;
        }

        .modal-content {
            max-width: 500px;
            margin: 10vh auto;
            background: var(--color-bg-elevated);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-5) var(--space-6);
            border-bottom: 1px solid var(--color-divider);
        }

        .modal-header h3 {
            font-size: var(--text-md);
            font-weight: var(--weight-semibold);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: var(--text-xl);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .modal-close:hover {
            background: var(--color-bg-sunken);
            color: var(--color-text);
        }

        .modal-body {
            padding: var(--space-6);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--color-accent);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: var(--space-4) var(--space-6);
            background: var(--color-success);
            color: white;
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            box-shadow: var(--shadow-lg);
            z-index: 300;
            transform: translateX(calc(100% + 40px));
            transition: transform var(--duration-normal) var(--ease-out);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: var(--color-danger);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                margin-left: 0;
                margin-top: var(--space-4);
            }

            .quick-links {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                flex-direction: column;
            }

            .auth-container {
                margin: var(--space-8) var(--space-4);
            }

            .auth-card {
                padding: var(--space-6);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <div class="logo-mark">惠</div>
                <span class="logo-text">惠购商城</span>
            </a>
            <div class="search">
                <span class="search-icon"></span>
                <input type="text" class="search-input" placeholder="搜索商品..." id="headerSearch" onkeydown="if(event.key==='Enter')window.location.href='/product.html?q='+this.value">
            </div>
            <nav class="nav">
                <a href="/" class="nav-link">首页</a>
                <a href="/product.html" class="nav-link">商品</a>
                <a href="/cart.html" class="nav-link">购物车</a>
                <a href="/orders.html" class="nav-link">订单</a>
                <a href="/user.html" class="nav-link active">我的</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-16);">
        <!-- Auth Section -->
        <div class="auth-container" id="authSection">
            <div class="auth-card">
                <h2 class="auth-title">欢迎来到 惠购商城</h2>
                <div class="auth-tabs">
                    <div class="auth-tab active" data-tab="login">登录</div>
                    <div class="auth-tab" data-tab="register">注册</div>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">登录</button>
                    <p class="form-footer">
                        还没有账号？<a href="#" onclick="switchTab('register')">立即注册</a>
                    </p>
                </form>

                <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="regUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="请输入密码" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-input" id="regConfirmPassword" placeholder="请再次输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">注册</button>
                    <p class="form-footer">
                        已有账号？<a href="#" onclick="switchTab('login')">立即登录</a>
                    </p>
                </form>
            </div>
        </div>

        <!-- User Profile Section -->
        <div class="profile-container" id="profileSection">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div class="profile-info">
                    <h2 id="profileUsername">用户名</h2>
                    <p id="profileEmail">邮箱</p>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="orderCount">0</div>
                        <div class="stat-label">订单</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="cartCount">0</div>
                        <div class="stat-label">购物车</div>
                    </div>
                </div>
            </div>

            <div class="quick-links">
                <a href="/orders.html" class="quick-link">
                    <div class="icon"></div>
                    <div class="text">我的订单</div>
                </a>
                <a href="/cart.html" class="quick-link">
                    <div class="icon"></div>
                    <div class="text">购物车</div>
                </a>
                <a href="#" class="quick-link" onclick="showSection('address')">
                    <div class="icon"></div>
                    <div class="text">收货地址</div>
                </a>
                <a href="#" class="quick-link" onclick="showSection('profile')">
                    <div class="icon"></div>
                    <div class="text">个人设置</div>
                </a>
            </div>

            <!-- Profile Settings -->
            <div class="profile-form" id="profileForm">
                <div class="profile-card">
                    <h3 class="card-title">个人信息</h3>
                    <form onsubmit="updateProfile(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-input" id="editUsername" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-input" id="editEmail">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">手机号</label>
                                <input type="tel" class="form-input" id="editPhone">
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="submit-btn" style="flex: 1;">保存修改</button>
                            <button type="button" class="btn-secondary" onclick="showSection(null)">取消</button>
                        </div>
                    </form>
                </div>

                <div class="profile-card" style="margin-top: var(--space-5);">
                    <h3 class="card-title">修改密码</h3>
                    <form onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label class="form-label">当前密码</label>
                            <input type="password" class="form-input" id="oldPassword" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-input" id="newPassword" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-input" id="confirmNewPassword" required>
                        </div>
                        <button type="submit" class="submit-btn">修改密码</button>
                    </form>
                </div>
            </div>

            <!-- Address Section -->
            <div class="address-section" id="addressSection">
                <div class="profile-card">
                    <h3 class="card-title">收货地址</h3>
                    <div id="addressList"></div>
                    <button class="add-btn" onclick="showAddressForm()">+ 添加新地址</button>
                </div>
            </div>

            <!-- Menu -->
            <div class="profile-card" style="margin-top: var(--space-5);">
                <ul class="menu-list">
                    <li class="menu-item" onclick="window.location.href='/orders.html'">
                        <span><span class="icon"></span> 我的订单</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="window.location.href='/cart.html'">
                        <span><span class="icon"></span> 购物车</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="showSection('address')">
                        <span><span class="icon"></span> 收货地址</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" id="merchantEntry" style="display:none;" onclick="enterMerchantCenter()">
                        <span><span class="icon"></span> 商家后台</span>
                        <span class="arrow">›</span>
                    </li>
                    <li class="menu-item" onclick="handleLogout()">
                        <span><span class="icon">🚪</span> 退出登录</span>
                        <span class="arrow">›</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Address Form Modal -->
    <div class="modal-overlay" id="addressModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="addressFormTitle">添加收货地址</h3>
                <button class="modal-close" onclick="closeAddressModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="saveAddress(event)">
                    <div class="form-group">
                        <label class="form-label">收货人</label>
                        <input type="text" class="form-input" id="addrName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-input" id="addrPhone" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">省份</label>
                            <input type="text" class="form-input" id="addrProvince">
                        </div>
                        <div class="form-group">
                            <label class="form-label">城市</label>
                            <input type="text" class="form-input" id="addrCity">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">区/县</label>
                            <input type="text" class="form-input" id="addrDistrict">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">详细地址</label>
                        <input type="text" class="form-input" id="addrDetail" required>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="addrDefault">
                            <span>设为默认地址</span>
                        </label>
                    </div>
                    <button type="submit" class="submit-btn">保存地址</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="/static/common.js"></script>
    <script>
        let currentUser = null;
        let editingAddressId = null;

        function checkAuth() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            if (token && username) {
                showProfile();
                loadUserProfile();
                checkMerchantStatus();
            } else {
                showAuth();
            }
        }

        async function checkMerchantStatus() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/api/merchant/info', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.is_merchant) {
                    document.getElementById('merchantEntry').style.display = 'block';
                }
            } catch (err) {
                console.log('商家状态检查失败');
            }
        }

        function enterMerchantCenter() {
            window.location.href = '/merchant.html';
        }

        function showAuth() {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('profileSection').style.display = 'none';
        }

        function showProfile() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'block';
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await fetch(`${API_BASE}/api/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', data.user ? data.user.username : username);
                    showToast('登录成功');
                    setTimeout(() => checkAuth(), 500);
                } else {
                    showToast(data.detail || '登录失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            if (password !== confirmPassword) {
                showToast('两次密码不一致', 'error');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/user/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('注册成功，请登录');
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    showToast(data.detail || '注册失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function loadUserProfile() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    currentUser = await res.json();
                    renderProfile();
                    loadOrderCount();
                    loadCartCount();
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('username');
                    showAuth();
                }
            } catch (err) {
                showToast('加载用户信息失败', 'error');
            }
        }

        function renderProfile() {
            if (!currentUser) return;
            document.getElementById('profileAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('profileUsername').textContent = currentUser.username;
            document.getElementById('profileEmail').textContent = currentUser.email;
            document.getElementById('editUsername').value = currentUser.username;
            document.getElementById('editEmail').value = currentUser.email;
            document.getElementById('editPhone').value = currentUser.phone || '';
        }

        async function loadOrderCount() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/orders?page_size=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('orderCount').textContent = data.total || 0;
                }
            } catch (err) {}
        }

        async function loadCartCount() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/cart`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('cartCount').textContent = data.items ? data.items.length : 0;
                }
            } catch (err) {}
        }

        function showSection(section) {
            document.getElementById('profileForm').style.display = section === 'profile' ? 'block' : 'none';
            document.getElementById('addressSection').style.display = section === 'address' ? 'block' : 'none';
            if (section === 'address') loadAddresses();
        }

        async function updateProfile(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const email = document.getElementById('editEmail').value;
            const phone = document.getElementById('editPhone').value;
            try {
                const res = await fetch(`${API_BASE}/api/user/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ email, phone })
                });
                if (res.ok) {
                    showToast('更新成功');
                    loadUserProfile();
                } else {
                    const data = await res.json();
                    showToast(data.detail || '更新失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            if (newPassword !== confirmNewPassword) {
                showToast('两次密码不一致', 'error');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/user/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
                });
                if (res.ok) {
                    showToast('密码修改成功');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmNewPassword').value = '';
                } else {
                    const data = await res.json();
                    showToast(data.detail || '修改失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function loadAddresses() {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    renderAddresses(Array.isArray(data) ? data : []);
                }
            } catch (err) {
                showToast('加载地址失败', 'error');
            }
        }

        function renderAddresses(addresses) {
            const container = document.getElementById('addressList');
            if (addresses.length === 0) {
                container.innerHTML = '<p style="color: var(--color-text-secondary); text-align: center; padding: var(--space-4);">暂无收货地址</p>';
                return;
            }
            container.innerHTML = addresses.map(addr => `
                <div class="address-card">
                    <div class="address-info">
                        <div class="name">${escapeHTML(addr.name)} ${addr.is_default ? '<span class="badge badge-accent" style="margin-left:var(--space-2)">默认</span>' : ''}</div>
                        <div class="detail">${escapeHTML(addr.province || '')}${escapeHTML(addr.city || '')}${escapeHTML(addr.district || '')}${escapeHTML(addr.detail || '')}</div>
                        <div class="phone">${escapeHTML(addr.phone)}</div>
                    </div>
                    <div class="address-actions">
                        <button class="icon-btn" onclick="editAddress(${addr.id})"></button>
                        <button class="icon-btn danger" onclick="deleteAddress(${addr.id})">×</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddressForm() {
            editingAddressId = null;
            document.getElementById('addressFormTitle').textContent = '添加收货地址';
            document.getElementById('addrName').value = '';
            document.getElementById('addrPhone').value = '';
            document.getElementById('addrProvince').value = '';
            document.getElementById('addrCity').value = '';
            document.getElementById('addrDistrict').value = '';
            document.getElementById('addrDetail').value = '';
            document.getElementById('addrDefault').checked = false;
            document.getElementById('addressModal').style.display = 'block';
        }

        async function editAddress(id) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    const addr = (Array.isArray(data) ? data : []).find(a => a.id === id);
                    if (addr) {
                        editingAddressId = id;
                        document.getElementById('addressFormTitle').textContent = '编辑收货地址';
                        document.getElementById('addrName').value = addr.name;
                        document.getElementById('addrPhone').value = addr.phone;
                        document.getElementById('addrProvince').value = addr.province || '';
                        document.getElementById('addrCity').value = addr.city || '';
                        document.getElementById('addrDistrict').value = addr.district || '';
                        document.getElementById('addrDetail').value = addr.detail || '';
                        document.getElementById('addrDefault').checked = addr.is_default;
                        document.getElementById('addressModal').style.display = 'block';
                    }
                }
            } catch (err) {
                showToast('加载地址失败', 'error');
            }
        }

        function closeAddressModal() {
            document.getElementById('addressModal').style.display = 'none';
        }

        async function saveAddress(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const addressData = {
                name: document.getElementById('addrName').value,
                phone: document.getElementById('addrPhone').value,
                province: document.getElementById('addrProvince').value,
                city: document.getElementById('addrCity').value,
                district: document.getElementById('addrDistrict').value,
                detail: document.getElementById('addrDetail').value,
                is_default: document.getElementById('addrDefault').checked
            };
            try {
                let url = `${API_BASE}/api/user/addresses`;
                let method = 'POST';
                if (editingAddressId) {
                    url = `${API_BASE}/api/user/addresses/${editingAddressId}`;
                    method = 'PUT';
                }
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(addressData)
                });
                if (res.ok) {
                    showToast(editingAddressId ? '地址更新成功' : '地址添加成功');
                    closeAddressModal();
                    loadAddresses();
                } else {
                    const data = await res.json();
                    showToast(data.detail || '保存失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        async function deleteAddress(id) {
            if (!confirm('确定删除该地址？')) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`${API_BASE}/api/user/addresses/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showToast('地址已删除');
                    loadAddresses();
                } else {
                    showToast('删除失败', 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            showToast('已退出登录');
            setTimeout(() => checkAuth(), 500);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('addressModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('addressModal')) closeAddressModal();
        });

        checkAuth();
    </script>
    <script src="/static/ws.js"></script>
</body>
</html>
